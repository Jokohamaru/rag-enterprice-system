services:
  mongodb-atlas-local:
    image: mongodb/mongodb-atlas-local:latest
    container_name: mongodb-atlas-rag
    restart: unless-stopped
    ports:
      - "27018:27017"
    environment:
      MONGODB_INITDB_ROOT_USERNAME: admin
      MONGODB_INITDB_ROOT_PASSWORD: password123
    volumes:
      - mongodb_atlas_data:/data/db
      - mongodb_atlas_config:/data/configdb

volumes:
  mongodb_atlas_data:
  mongodb_atlas_config:
